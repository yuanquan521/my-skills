<svg viewBox="0 0 340 260" width="340" height="260" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- 外框直角梯形 ABCD -->
  <polygon points="70,40 270,40 270,85 70,200" fill="#ffffff" stroke="#000000" stroke-width="2" />
  
  <!-- 分割线 ED -->
  <line x1="70" y1="155" x2="270" y2="40" stroke="#000000" stroke-width="2" />

  <!-- 顶点标签 Times New Roman 斜体 -->
  <text x="45" y="46" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#000000">A</text>
  <text x="45" y="162" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#000000">E</text>
  <text x="45" y="210" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#000000">B</text>
  <text x="280" y="46" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#000000">D</text>
  <text x="280" y="95" font-family="'Times New Roman', serif" font-style="italic" font-size="20" fill="#000000">C</text>

  <!-- 试卷图题名 -->
  <text x="170" y="235" font-family="'Songti SC', STSong, SimSun, serif" font-size="16" fill="#000000" text-anchor="middle">（第 12 题）</text>
</svg>
